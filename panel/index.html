<!doctype html>
<html lang="ko">
<head>
<script src="/shared/gate.js"></script>
<script src="/shared/project.js?v=1"></script>
<script src="/shared/sitenav.js?v=6"></script>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>jbslab 판넬·팸플릿</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="panel.css?v=2">
<style id="pageSize">@page{size:841mm 1189mm;margin:0}</style>
</head>
<body>
<header class="top"><b>jbslab</b> <span class="sub">/panel</span> <h1>판넬·팸플릿 만들기</h1></header>
<div class="layout">
  <aside class="ctl">
    <section>
      <h2>1. 구역</h2>
      <label>구역<select id="siteSel"></select></label>
      <p class="note" id="siteInfo"></p>
    </section>
    <section>
      <h2>2. 만들 것</h2>
      <label>종류<select id="kind">
        <optgroup label="판넬"><option value="panelP">A0 판넬(세로)</option><option value="panelL">A0 판넬(가로)</option></optgroup>
        <optgroup label="사업 단계별 팸플릿(A4 3단 접지, 앞·뒤 2쪽)" id="stageOpts"></optgroup>
      </select></label>
    </section>
    <section>
      <h2>3. 내용</h2>
      <label>사업명<input id="title" placeholder="예: ○○구역 주택재개발 정비사업"></label>
      <label>단계·부제<input id="subtitle" placeholder="예: 정비계획(안) 주민설명회"></label>
      <label>문의처<input id="contact" placeholder="예: ○○구청 도시정비과 032-000-0000"></label>
      <label>일시·장소(팸플릿)<input id="when" placeholder="예: 2027. 1. 15.(금) 19:00, ○○동 행정복지센터"></label>
      <label>조감도 그림(PNG·JPG)<input id="birdFile" type="file" accept="image/*"></label>
      <p class="note">조감도는 /arch 결과 [조감도] 탭의 [판넬로 보내기]를 누르면 자동으로 들어옵니다(또는 PNG를 직접 올림). 올린 그림은 이 화면 안에서만 쓰고 저장·전송하지 않습니다.</p>
      <label class="chk"><input id="showFeas" type="checkbox"> 판넬에 개략 사업성(비례율) 넣기</label>
    </section>
    <section>
      <button class="primary" id="print">인쇄 / PDF로 저장</button>
      <p class="note">인쇄 창에서 '대상: PDF로 저장', 용지 크기는 자동(판넬 A0 841×1189mm, 팸플릿 A4 가로), 여백 '없음', '배경 그래픽' 켜기. A0 출력소에는 PDF를 그대로 넘기면 됩니다.</p>
    </section>
  </aside>
  <main class="stage"><div id="sheets"></div></main>
</div>
<script src="../shared/site-store.js?v=155"></script>
<script src="../shared/panel-img.js?v=1"></script>
<script src="panel.js?v=3"></script>
<script src="../shared/workfile.js?v=8"></script>
</body>
</html>
