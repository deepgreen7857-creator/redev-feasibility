<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>입찰 판단표</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 한 줄에 물건 하나: 지금 회차 → 들어갈 회차, 펼치면 회차표·근거 */
:root{
  --bg:#f5f6f3; --panel:#ffffff; --fg:#1d2420; --muted:#66706a; --line:#dde2dc;
  --accent:#1f6b4f; --wait:#9a6a12; --wait-bg:#fbf1dc; --go:#1f6b4f; --go-bg:#e0f0e8; --no:#a33a2c; --no-bg:#f8e3df;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif; --mono:"IBM Plex Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141916; --panel:#1c231f; --fg:#e4ebe6; --muted:#98a39c; --line:#2d3631;
  --accent:#6cc39b; --wait:#e2b45a; --wait-bg:#3a2f18; --go:#6cc39b; --go-bg:#183326; --no:#ee8b7c; --no-bg:#3c1f1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141916; --panel:#1c231f; --fg:#e4ebe6; --muted:#98a39c; --line:#2d3631;
  --accent:#6cc39b; --wait:#e2b45a; --wait-bg:#3a2f18; --go:#6cc39b; --go-bg:#183326; --no:#ee8b7c; --no-bg:#3c1f1a; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 var(--sans)}
.wrap{max-width:1480px;margin:0 auto;padding-block:28px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:24px;margin:0 0 18px;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.rule{font-size:13px;font-weight:400;color:var(--muted)}
.lead{color:var(--muted);margin:0 0 22px;font-size:14px;max-width:70ch}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-bottom:26px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;text-align:left;color:inherit;font:inherit;padding:0}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ph{position:relative;aspect-ratio:16/9;max-width:100%;background:var(--bg);display:grid;place-items:center;border-bottom:1px solid var(--line)}
.ph img{width:100%;height:100%;object-fit:cover}
.ph svg{width:46%;height:auto;color:var(--muted)}
.ph .chip{position:absolute;top:10px;left:10px}
.ph .dday{position:absolute;top:10px;right:10px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:1px 8px;font-size:12px}
.cbody{padding:12px 14px 14px;display:grid;gap:10px}
.cbody .addr{font-size:15px;line-height:1.35}
.ladder{display:flex;gap:3px}
.step{flex:1;min-width:0;border-radius:5px;padding:4px 2px;text-align:center;font-size:10.5px;line-height:1.25;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.step b{display:block;font-size:11.5px;font-family:var(--mono);font-weight:500}
.step.past{text-decoration:line-through;opacity:.6}
.step.cur{border-color:var(--fg);color:var(--fg)}
.step.between{background:var(--wait-bg);color:var(--wait);border-color:transparent}
.step.entry{background:var(--go);color:var(--panel);border-color:var(--go)}
.gauge{position:relative;height:30px;margin-top:2px}
.gbar{position:absolute;left:0;right:0;top:12px;height:6px;border-radius:3px;background:var(--line)}
.gmk{position:absolute;top:12px;height:6px;background:var(--accent);opacity:.35;border-radius:3px}
.gpin{position:absolute;top:6px;width:2px;height:18px;background:var(--fg)}
.gpin.e{background:var(--go);width:3px}
.glab{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
.links{display:flex;gap:12px;font-size:13px}
.links a{color:var(--accent)}
h2{font-size:15px;margin:0 0 10px;color:var(--muted)}

.row{grid-template-columns:96px minmax(0,1fr)!important;align-items:center;gap:14px!important;padding:12px!important}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,430px),1fr));gap:10px;align-items:start}
#list .item{margin:0!important}
#list .item:has(.body:not([hidden])){grid-column:1/-1}
.l1{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.th .chip{position:absolute;left:0;right:0;bottom:0;border-radius:0;font-size:11px;padding:1px 0;text-align:center}
.l1 .addr{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l2,.l3{font-size:13px;line-height:1.5;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l2{color:var(--muted)}
.th{position:relative;width:96px;height:72px;border-radius:6px;overflow:hidden;background:var(--bg);display:grid;place-items:center;border:1px solid var(--line)}
.th img{width:100%;height:100%;object-fit:cover}.th svg{width:34px;color:var(--muted)}
.row .addr{font-size:15px;font-weight:600;line-height:1.35}
.ladder.mini .step{padding:3px 1px;font-size:10px}
.item{margin-bottom:6px!important}
@media (max-width:640px){.row{grid-template-columns:72px minmax(0,1fr)!important}.th{width:72px;height:60px}}
.item{background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-bottom:12px}
.head{display:grid;grid-template-columns:1fr auto;gap:12px;padding:16px 18px;cursor:pointer;width:100%;background:none;border:0;color:inherit;text-align:left;font:inherit}
.head:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.addr{font-weight:600;font-size:16px}
.sub{color:var(--muted);font-size:13px}
.flow{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:14px;align-items:center}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:600;white-space:nowrap}
.go{background:var(--go-bg);color:var(--go)} .wait{background:var(--wait-bg);color:var(--wait)} .no{background:var(--no-bg);color:var(--no)}
.body[hidden]{display:none}
.body{border-top:1px solid var(--line);padding:16px 18px;display:grid;gap:18px}
.sum{font-weight:600}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:14px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:600;font-size:12px;letter-spacing:.02em}
tr.entry td{background:var(--go-bg)}
tr.past td{color:var(--muted)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.cols>div{min-width:0}
h3{font-size:13px;color:var(--muted);margin:0 0 6px;letter-spacing:.03em}
ul{margin:0;padding-left:18px} li{margin-bottom:3px}
.note{font-size:13px;color:var(--muted)}
.pred{font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <h1>입찰 판단표 <span class="rule">최저입찰가: 입찰최저가 + 1만 원 · 법인 취득세 1.1% 물건만 검토</span></h1>
  <div id="list"><p class="note">물건을 불러오는 중입니다.</p></div>
</div>
<script>
const RATE=0.7, MAXK=6;
const won=n=>(Math.round(n/10000)).toLocaleString('ko-KR')+'만';
const wonFull=n=>n.toLocaleString('ko-KR');
const rname=k=>k===0?'최초':k+'회 유찰';
function calc(it){
  const low=it.market.low, D=it.priorDeposit||0, A=it.assume||0;
  const X=(low-it.costs-it.minProfit)/1.011;          // 총투입(낙찰가+인수) 한도
  let hi=D? (X>=D?X:-1) : X-A;                          // 최고입찰가
  hi=hi>0?Math.floor(hi/10000)*10000:0;
  const rows=[]; let min=it.appraisal;
  for(let k=0;k<=MAXK;k++){
    if(k>0) min=Math.floor(Math.round(min*RATE)/1000)*1000;
    const bid=min+10000, take=D?Math.max(0,D-bid):A, total=bid+take, tax=Math.round(total*0.011);
    rows.push({k,min,bid,take,tax,profit:low-total-tax-it.costs,ok:hi>0&&bid<=hi});
  }
  const cur=it.rounds.findIndex(r=>r.result!=='유찰');
  const curK=cur<0?it.rounds.length:cur;
  const entry=rows.find(r=>r.k>=curK&&r.ok)||null;
  return {rows,curK,entry,hi,X,D};
}
function rank(it){const c=calc(it);if(!c.entry)return 999;return Math.max(0,c.entry.k-c.curK)}
function sortItems(d){return d.slice().sort((a,b)=>rank(a)-rank(b)||String((a.rounds[calc(a).curK]||{}).date||'9').localeCompare(String((b.rounds[calc(b).curK]||{}).date||'9')))}
function mini(it,c){const last=Math.min(MAXK,Math.max(c.entry?c.entry.k:c.curK,c.curK)+1);
  return c.rows.slice(0,last+1).map(r=>{let cl='step';if(r.k<c.curK)cl+=' past';if(r.k===c.curK)cl+=' cur';
  if(c.entry&&r.k===c.entry.k)cl+=' entry';else if(c.entry&&r.k>c.curK&&r.k<c.entry.k)cl+=' between';
  return `<div class="${cl}" title="${rname(r.k)} ${wonFull(r.min)}원">${r.k===0?'최초':r.k+'회'}<b>${Math.round(r.min/1e5)/10}</b></div>`}).join('')}

function render(items){
  const el=document.getElementById('list');
  if(!items.length){el.innerHTML='<p class="note">아직 올린 물건이 없습니다.</p>';return}
  el.innerHTML='';
  items.forEach((it,i)=>{
    const c=calc(it), cur=it.rounds[c.curK]||{};
    let chip,flow;
    if(!c.entry){chip='<span class="chip no">제외</span>';flow='<div class="l2">'+(it.excludeNote||'')+'</div><div class="l3">비용·인수 합계가 시세 한도를 넘어 유찰돼도 안 됨</div>'}
    else{
      const left=c.entry.k-c.curK;
      chip=left<=0?'<span class="chip go">금회 진입</span>':'<span class="chip wait">'+left+'번 더 유찰</span>';
      const fmt=d=>d?d.replace(/-/g,'.')+'.('+'일월화수목금토'[new Date(d+'T12:00:00Z').getUTCDay()]+')':'미정';
      const sh=d=>d?d.slice(5).replace('-','.')+'('+'일월화수목금토'[new Date(d+'T12:00:00Z').getUTCDay()]+')':'미정';
      const dstr=sh(cur.date), prev=c.curK>0?it.rounds[c.curK-1]:null;
      const past=prev?sh(prev.date)+' '+c.curK+'회 유찰됨 · ':'신건 · ';
      const when=left<=0?'금회':(left===1?'차회':(left===2?'차차회':left+'회 뒤'));
      const lo=c.entry.bid, hi=c.hi, chun=n=>Math.round(n/1000).toLocaleString('ko-KR')+'천원';
      flow='<div class="l2">'+past+'금회 <b>'+dstr+'</b> <span class="num">'+(c.rows[c.curK].min/10000).toLocaleString('ko-KR')+'만원</span></div><div class="l3">입찰시점 <b>'+when+'</b> · 입찰예정가 <b class="num">'+(Math.round(lo/1000)).toLocaleString('ko-KR')+'~'+chun(hi)+'</b></div>';
    }
    const box=document.createElement('section');box.className='item';
    box.innerHTML=`<button class="head row" id="h${i}" aria-expanded="false">
      <div class="th">${it.photo?`<img src="${it.photo}" alt="">`:HOUSE}${chip}</div>
      <div class="mid"><div class="l1"><span class="addr" title="${it.address}">${it.address.replace(/^인천\s+/,"")}</span></div>${flow}</div></button>
      <div class="body" hidden>
        <div class="sum">${it.summary}</div><div class="links"><a href="https://map.kakao.com/link/search/${encodeURIComponent(it.address.replace(/\s+\S+동\s+\S+호$/,"").replace(/\s+\S+호$/,""))}" target="_blank" rel="noopener">카카오맵·로드뷰</a><a href="https://map.naver.com/p/search/${encodeURIComponent(it.address.replace(/\s+\S+동\s+\S+호$/,"").replace(/\s+\S+호$/,""))}" target="_blank" rel="noopener">네이버지도</a></div>
        <div><h3>회차표 · 시세 하한 ${won(it.market.low)}, 비용 ${won(it.costs)}, 목표수익 ${won(it.minProfit)}${c.D?', 선순위 보증금(집행비용 포함) '+won(c.D):''}${it.assume?', 인수 가정 '+won(it.assume):''}</h3>
        <p class="sum" style="margin:0 0 6px">최고입찰가 <span class="num">${c.hi?wonFull(c.hi)+'원':'없음'}</span>${it.bidLo?' · 경쟁 판단: '+it.bidLo.why:''}</p>
        <div class="tbl"><table><thead><tr><th>회차</th><th>최저가</th><th>최저가 입찰 시 인수</th><th>취득세 1.1%</th><th>최저가 입찰 시 수익</th><th>판정</th></tr></thead><tbody>
        ${c.rows.map(r=>`<tr class="${c.entry&&r.k===c.entry.k?'entry':''} ${r.k<c.curK?'past':''}"><td>${rname(r.k)}${(it.rounds[r.k]&&it.rounds[r.k].date)?' · '+it.rounds[r.k].date:''}${r.k<c.curK?' (유찰)':''}</td><td class="num">${wonFull(r.min)}</td><td class="num">${r.take?won(r.take):'0'}</td><td class="num">${wonFull(r.tax)}</td><td class="num">${won(r.profit)}</td><td>${r.ok?'가능':'불가'}</td></tr>`).join('')}
        </tbody></table></div>
        <p class="note">최고입찰가 = (시세 하한 − 비용 − 목표수익) ÷ 1.011 − 인수금액. 최저가가 이 금액 아래로 처음 내려오는 회차가 진입 회차입니다. ${it.assumeNote||''}</p></div>
        <div class="cols">
          <div><h3>시세 근거 (${won(it.market.low)} ~ ${won(it.market.high)})</h3><ul>${it.market.basis.map(x=>'<li>'+x+'</li>').join('')}</ul></div>
          <div><h3>권리</h3><ul>${it.rights.map(x=>'<li>'+x+'</li>').join('')}</ul></div>
          <div><h3>사건 타임라인</h3><ul>${it.timeline.map(x=>'<li>'+x+'</li>').join('')}</ul></div>
          <div><h3>주의</h3><ul>${it.flags.map(x=>'<li>'+x+'</li>').join('')}</ul></div>
          <div><h3>결론을 바꿀 확인사항</h3><ul>${it.checks.map(x=>'<li>'+x+'</li>').join('')}</ul></div>
          <div><h3>법인 1.1%</h3><p style="margin:0">${it.tax11}</p></div>
        </div>
        <div class="pred"><h3>유찰 예측 기록</h3>${it.prediction.date} ${it.prediction.round}: 예측 <b>${it.prediction.predict}</b> · 실제 <b>${it.prediction.actual||'기일 전'}</b> <span class="note">(검토일 ${it.reviewed})</span></div>
      </div>`;
    el.appendChild(box);
    const h=box.querySelector('.head'),b=box.querySelector('.body');
    h.addEventListener('click',()=>{b.hidden=!b.hidden;h.setAttribute('aria-expanded',String(!b.hidden))});
  });
}

const HOUSE='<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M8 30 32 10l24 20"/><path d="M14 26v28h36V26"/><rect x="21" y="32" width="8" height="8"/><rect x="35" y="32" width="8" height="8"/><path d="M28 54V44h8v10"/></svg>';
function dday(d){if(!d)return'';const t=new Date(d+'T00:00:00+09:00'),n=new Date();const x=Math.ceil((t-n)/864e5);return x>0?'D-'+x:(x===0?'오늘':'')}
function cards(items){
  const el=document.getElementById('cards');el.innerHTML='';
  items.forEach((it,i)=>{
    const c=calc(it),cur=it.rounds[c.curK]||{};
    const left=c.entry?c.entry.k-c.curK:null;
    const chip=!c.entry?'<span class="chip no">제외</span>':(left<=0?'<span class="chip go">금회 진입</span>':'<span class="chip wait">'+left+'번 더 유찰</span>');
    const last=Math.max(c.entry?c.entry.k:c.curK,c.curK)+1;
    const steps=c.rows.slice(0,Math.min(last+1,MAXK+1)).map(r=>{
      let cl='step';
      if(r.k<c.curK)cl+=' past'; if(r.k===c.curK)cl+=' cur';
      if(c.entry&&r.k===c.entry.k)cl+=' entry'; else if(c.entry&&r.k>c.curK&&r.k<c.entry.k)cl+=' between';
      return `<div class="${cl}">${r.k===0?'최초':r.k+'회'}<b>${Math.round(r.min/1e6*10)/10}</b></div>`}).join('');
    const max=it.appraisal, pct=v=>Math.max(0,Math.min(100,v/max*100));
    const curMin=c.rows[c.curK].min, eb=c.entry?c.entry.bid:null;
    const q=encodeURIComponent(it.address.replace(/\s+\d+동\s+\d+호$/,'').replace(/\s+\S+호$/,''));
    const card=document.createElement('button');card.className='card';card.type='button';
    card.innerHTML=`<div class="ph">${it.photo?`<img src="${it.photo}" alt="${it.address} 사진">`:HOUSE}${chip}<span class="dday num">${dday(cur.date)} ${cur.date?cur.date.slice(5).replace('-','/'):''}</span></div>
      <div class="cbody">
        <div><div class="addr">${it.address}</div><div class="sub">${it.type} · ${it.id}</div></div>
        <div><div class="sub" style="margin-bottom:4px">회차 사다리 (최저가, 백만 원)</div><div class="ladder">${steps}</div></div>
        <div><div class="sub">시세 ${won(it.market.low)}~${won(it.market.high)} 대비</div>
          <div class="gauge"><div class="gbar"></div><div class="gmk" style="left:${pct(it.market.low)}%;width:${pct(it.market.high)-pct(it.market.low)}%"></div>
          <div class="gpin" style="left:${pct(curMin)}%" title="지금 최저가"></div>${eb?`<div class="gpin e" style="left:${pct(eb)}%" title="진입 입찰가"></div>`:''}</div>
          <div class="glab"><span>지금 ${won(curMin)}</span><span>${eb?'진입 '+won(eb):'진입 없음'}</span><span>감정 ${won(max)}</span></div></div>
        <div class="links"><span>${c.entry?'진입 <b>'+rname(c.entry.k)+'</b> · 입찰 <b class="num">'+wonFull(c.entry.bid)+'</b>':'인수금액 과다'}</span></div>
        <div class="links"><a href="https://map.kakao.com/link/search/${q}" target="_blank" rel="noopener">카카오맵·로드뷰</a><a href="https://map.naver.com/p/search/${q}" target="_blank" rel="noopener">네이버지도</a></div>
      </div>`;
    card.addEventListener('click',e=>{if(e.target.closest('a'))return;const box=document.querySelectorAll('.item')[i];const h=box.querySelector('.head'),b=box.querySelector('.body');b.hidden=false;h.setAttribute('aria-expanded','true');box.scrollIntoView({behavior:'smooth',block:'start'})});
    el.appendChild(card);
  });
}

fetch('items.json',{cache:'no-store'}).then(r=>r.json()).then(d=>render(sortItems(d)))
  .catch(()=>{document.getElementById('list').innerHTML='<p class="note">items.json을 읽지 못했습니다. 같은 폴더에 있는지 확인해 주세요.</p>'});
</script>
</body>
</html>
