<!doctype html><html lang="ko"><head>
<script src="/shared/gate.js"></script>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>검토서 라이브러리</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1d2321;--sub:#5d6662;--line:#dfe2dd;--acc:#1f5f4a;--ok:#2e7d4f;--fix:#b4532a;--chk:#8a6d1a;--okb:#e6f2ea;--fixb:#fbeee6;--chkb:#f7f0d8}
@media (prefers-color-scheme:dark){:root{--bg:#141716;--card:#1c201e;--ink:#e6ebe8;--sub:#9aa5a0;--line:#2c3330;--acc:#6cc3a0;--ok:#7fd19e;--fix:#f0a07a;--chk:#e3c66b;--okb:#1e3127;--fixb:#3a251c;--chkb:#353018}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Pretendard","Malgun Gothic",system-ui,sans-serif}
#jbs-gate-out{left:auto!important;right:10px!important}body{padding-bottom:48px}
header{padding:20px 20px 8px;border-bottom:1px solid var(--line)}h1{margin:0;font-size:20px}header p{margin:4px 0 0;color:var(--sub);font-size:13px}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.st{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:13px}.st b{font-size:17px;margin-right:4px}
nav{display:flex;gap:4px;padding:10px 20px;flex-wrap:wrap}nav button,.flt button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:6px;cursor:pointer;font:inherit;font-size:13px}nav button.on,.flt button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
main{display:grid;grid-template-columns:300px 1fr;gap:16px;padding:0 20px 40px}@media(max-width:820px){main{grid-template-columns:1fr}}
.list .o{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:pointer}.list .o.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}.o .id{font-size:12px;color:var(--sub)}.o .nm{font-weight:600}.o .tp{font-size:12px;color:var(--acc)}.o .cnt{font-size:12px;color:var(--sub);margin-top:2px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.meta{display:grid;grid-template-columns:110px 1fr;gap:4px 12px;font-size:14px;margin-bottom:14px}.meta dt{color:var(--sub)}.meta dd{margin:0}
.flt{display:flex;gap:6px;margin:8px 0 12px;flex-wrap:wrap}
.it{border-top:1px solid var(--line);padding:12px 0}.it h3{margin:0 0 6px;font-size:15px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{font-size:12px;padding:1px 8px;border-radius:10px;font-weight:600}.t적합{background:var(--okb);color:var(--ok)}.t보완{background:var(--fixb);color:var(--fix)}.t확인필요{background:var(--chkb);color:var(--chk)}
.row{display:grid;grid-template-columns:90px 1fr;gap:2px 10px;font-size:14px}.row .k{color:var(--sub)}.q{font-style:normal;background:var(--bg);border-left:3px solid var(--line);padding:2px 8px}.op{font-weight:500}
.pat{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px}.pat h3{margin:0 0 4px;font-size:15px}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}th{color:var(--sub);font-weight:500}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:6px;cursor:pointer;font:inherit;font-size:13px}#msg{font-size:13px;color:var(--sub)}
input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font:inherit;margin-bottom:10px}
</style></head><body>
<script src="/shared/sitenav.js?v=1ab85f00"></script>
<header><h1>검토서 라이브러리 <span style="font-weight:400;color:var(--sub);font-size:14px">jbslab.co.kr/library</span></h1><p>원본 그대로 보관 · 항목별 분해 · 현행 조문 대조 — 본인 전용 자료</p><div class="stats" id="stats"></div>
<div class="bar"><label class="btn">파일 가져와 저장(library.json)<input type="file" id="imp" accept=".json,application/json" hidden></label><button class="btn" id="exp">내려받기</button><span id="msg"></span></div></header>
<nav id="nav"><button data-v="orig" class="on">원본별</button><button data-v="pat">반복 패턴</button><button data-v="chk">마스터 체크리스트</button><button data-v="all">전체 항목 검색</button></nav>
<main id="main"></main>
<script type="module">
let L=null;
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let cur=null,flt='전체',view='orig';
function stats(){$('#stats').innerHTML=`<div class="st"><b>${L.통계.원본}</b>건</div><div class="st"><b>${L.통계.항목}</b>항목</div><div class="st"><b style="color:var(--ok)">${L.통계.적합||0}</b>적합</div><div class="st"><b style="color:var(--fix)">${L.통계.보완||0}</b>보완</div><div class="st"><b style="color:var(--chk)">${L.통계.확인필요||0}</b>확인필요</div>`;}
const itemHTML=i=>`<div class="it"><h3><span class="tag t${i.판단}">${i.판단}</span>${esc(i.표준항목)}<span style="font-size:12px;color:var(--sub);font-weight:400">${i.id}</span></h3><div class="row"><span class="k">근거</span><span>${esc(i.근거조문)}</span><span class="k">제출·현황</span><span>${esc(i.제출내용)}</span><span class="k">검토서 문구</span><span class="q">${esc(i.실제문구)}</span><span class="k">대조 의견</span><span class="op">${esc(i.검토의견)}</span></div></div>`;
function orig(){const o=L.originals.find(x=>x.id===cur);const its=L.items.filter(i=>i.원본===cur&&(flt==='전체'||i.판단===flt));
const keys=Object.keys(o).filter(k=>!['id','파일'].includes(k));
$('#main').innerHTML=`<div class="list">${L.originals.map(x=>{const n=L.items.filter(i=>i.원본===x.id);const b=n.filter(i=>i.판단==='보완').length;return `<div class="o ${x.id===cur?'on':''}" data-id="${x.id}"><div class="id">${x.id} · ${x.검토일}</div><div class="nm">${esc(x.구역명)}</div><div class="tp">${esc(x.인허가단계)}</div><div class="cnt">${n.length}항목 · 보완 ${b}</div></div>`}).join('')}</div>
<div class="panel"><dl class="meta">${keys.map(k=>`<dt>${k}</dt><dd>${esc(o[k])}</dd>`).join('')}<dt>원본 파일</dt><dd>${o.파일.map(esc).join('<br>')}</dd></dl>
<div class="flt">${['전체','보완','확인필요','적합'].map(f=>`<button class="${f===flt?'on':''}" data-f="${f}">${f}</button>`).join('')}</div>${its.map(itemHTML).join('')||'<p>해당 항목 없음</p>'}</div>`;
document.querySelectorAll('.o').forEach(e=>e.onclick=()=>{cur=e.dataset.id;flt='전체';orig()});document.querySelectorAll('[data-f]').forEach(e=>e.onclick=()=>{flt=e.dataset.f;orig()});}
function pat(){$('#main').innerHTML=`<div class="panel" style="grid-column:1/-1">${L.patterns.map(p=>`<div class="pat"><h3>${esc(p.패턴)}</h3><div style="color:var(--sub);font-size:13px">${p.해당.map(id=>id+' '+esc(L.originals.find(o=>o.id===id).구역명)).join(' · ')}</div><p style="margin:6px 0 0">${esc(p.설명)}</p></div>`).join('')}<h3 style="margin-top:20px">설계 변경 사항</h3><ul>${L.설계변경.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></div>`}
function chk(){const rows=[];for(const [g,cs] of Object.entries(L.checklist_new))for(const c of cs){const n=L.items.filter(i=>i.표준항목===c);rows.push(`<tr><td>${esc(g)}</td><td>${esc(c)}</td><td>${n.length}</td><td>${n.filter(i=>i.판단==='보완').length}</td><td>${esc(n[0]?.근거조문)}</td></tr>`)}
$('#main').innerHTML=`<div class="panel" style="grid-column:1/-1;overflow-x:auto"><table><tr><th>분류</th><th>검토항목</th><th>사례</th><th>보완</th><th>근거(첫 사례 기준)</th></tr>${rows.join('')}</table></div>`}
function all(){$('#main').innerHTML=`<div class="panel" style="grid-column:1/-1"><input id="q" placeholder="조문, 구역명, 단어로 검색 (예: 제35조, 신고, 도화1)"><div id="r"></div></div>`;const run=()=>{const q=$('#q').value.trim();const r=L.items.filter(i=>!q||JSON.stringify(i).includes(q)||(L.originals.find(o=>o.id===i.원본).구역명.includes(q)));$('#r').innerHTML=`<p style="color:var(--sub)">${r.length}건</p>`+r.map(itemHTML).join('')};$('#q').oninput=run;run()}
const V={orig,pat,chk,all};document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on');view=b.dataset.v;if(!L||!L.originals||!L.originals.length){$('#main').innerHTML='<div class="panel" style="grid-column:1/-1">저장된 라이브러리가 없습니다. 위 [파일 가져와 저장]으로 library.json을 올리세요.</div>';return;}V[view]()});   // 자료가 없을 때 탭을 눌러도 오류 없이(2026-11-13 전체 점검)

// ── 저장소: Firestore 'reviewLib/main'(관리자 전용). 규칙 배포 전이면 이미 열린 'jbsWork/_reviewLib'에 보관(savedAt이 없어 작업 목록에는 안 나옴)
const FBV='10.12.2', CHUNK=700000;
let FB=null;
const msg=t=>{$('#msg').textContent=t};
async function fb(){
  if(FB) return FB;
  const [A,U,F]=await Promise.all(['app','auth','firestore'].map(n=>import(`https://www.gstatic.com/firebasejs/${FBV}/firebase-${n}.js`)));
  const app=A.getApps().length?A.getApp():A.initializeApp({apiKey:'AIzaSyAaqAP7371502cfR3OpnYC33tTfE7EeqtI',authDomain:'jbslab-auction.firebaseapp.com',projectId:'jbslab-auction',appId:'1:780407673324:web:0506b356fb74a8c68a30c9'});
  const auth=U.getAuth(app);
  await new Promise(r=>{const off=U.onAuthStateChanged(auth,u=>{if(u){off();r()}})});
  FB={F,db:F.getFirestore(app)};return FB;
}
const SLOTS=[['reviewLib','main'],['jbsWork','_reviewLib']];
async function readSlot(F,db,[c,id]){
  const d=await F.getDoc(F.doc(db,c,id)); if(!d.exists()) return null;
  const m=d.data(); let s='';
  for(let i=0;i<m.n;i++){const p=await F.getDoc(F.doc(db,c,id,'chunks',String(i))); s+=p.data().d;}
  return {m,data:JSON.parse(s)};
}
async function load(){
  const {F,db}=await fb(); let best=null;
  for(const sl of SLOTS){try{const r=await readSlot(F,db,sl); if(r&&(!best||r.m.savedAt>best.m.savedAt)) best=Object.assign(r,{slot:sl});}catch(e){}}
  return best;
}
async function save(data){
  const {F,db}=await fb(); const s=JSON.stringify(data); const parts=[];
  for(let i=0;i<s.length;i+=CHUNK) parts.push(s.slice(i,i+CHUNK));
  const meta={n:parts.length,savedAt:Date.now(),원본:data.originals.length,항목:data.items.length,ver:data.ver||1};
  for(const [c,id] of SLOTS){
    try{
      for(let i=0;i<parts.length;i++) await F.setDoc(F.doc(db,c,id,'chunks',String(i)),{d:parts[i]});
      await F.setDoc(F.doc(db,c,id),meta);
      return c;
    }catch(e){ if(c==='jbsWork') throw e; }
  }
}
function show(){
  if(!L||!L.originals||!L.originals.length){$('#main').innerHTML='<div class="panel" style="grid-column:1/-1">저장된 라이브러리가 없습니다. 위 [파일 가져와 저장]으로 library.json을 올리세요.</div>';return;}
  const c={};L.items.forEach(i=>c[i.판단]=(c[i.판단]||0)+1);L.통계=Object.assign({원본:L.originals.length,항목:L.items.length},c);
  if(!cur||!L.originals.find(o=>o.id===cur)) cur=L.originals[0].id;
  stats();V[view]();
}
$('#imp').onchange=async e=>{
  const f=e.target.files[0]; if(!f) return;
  try{
    const d=JSON.parse(await f.text());
    if(!Array.isArray(d.originals)||!Array.isArray(d.items)) throw new Error('라이브러리 파일 형식이 아닙니다');
    if(L&&L.originals&&!confirm(`지금 저장된 것(원본 ${L.originals.length}건)을 이 파일(원본 ${d.originals.length}건)로 바꿉니다. 계속할까요?`)) return;
    msg('저장 중…'); const where=await save(d); L=d; show();
    msg(`저장했습니다 — 원본 ${d.originals.length}건 · 항목 ${d.items.length}개`+(where==='jbsWork'?' (임시 보관 자리, 규칙 배포 후 자동으로 옮겨짐)':''));
  }catch(err){msg('가져오기 실패: '+err.message)}
  e.target.value='';
};
$('#exp').onclick=()=>{
  if(!L) return; const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(L,null,1)],{type:'application/json'}));
  a.download='library-'+new Date().toISOString().slice(0,10)+'.json'; a.click();
};
(async()=>{
  msg('불러오는 중…');
  try{
    const r=await load();
    if(r){L=r.data; msg(`${new Date(r.m.savedAt).toLocaleString('ko-KR')} 저장본`+(r.slot[0]==='jbsWork'?' · 임시 보관 자리':''));
      if(r.slot[0]==='jbsWork'){ try{await save(L); }catch(e){} } }
    else msg('');
  }catch(e){msg('불러오기 실패: '+e.message)}
  show();
})();
</script></body></html>
