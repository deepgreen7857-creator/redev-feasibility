<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>jbslab 정비계획 검토</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css">
<link rel="stylesheet" href="../css/zonekit.css?v=72">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 상단 단계 탭(구역계→요건→정비계획→건축→사업성) + 좌측 도면 / 우측 수치 패널. 도면 관례: 구역계 = 적색 일점쇄선 */
:root{
  --paper:#f5f6f2; --sheet:#ffffff; --ink:#1d2a33; --ink-2:#4f5d66; --line:#d5dbd6; --grid:#e7ebe6;
  --redline:#c8322b; --accent:#1f5f8b; --accent-soft:#e3edf4;
  --ok:#2f7d4f; --ok-soft:#e2f1e7; --bad:#b4372f; --bad-soft:#f7e3e1; --warn:#9a6a10; --warn-soft:#f6ecd5;
  --old:#d9876f; --new:#c9d3cc; --small:#8f6bb3; --road:#eceee9; --roadline:#c7ccc6; --nobuild:#f1f2ee;
  --f-body:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#141a1e; --sheet:#1b2328; --ink:#e4e9ea; --ink-2:#9fadb3; --line:#2f3b42; --grid:#222c32;
  --redline:#ff6a5f; --accent:#7db8e0; --accent-soft:#1f3242;
  --ok:#6fcf93; --ok-soft:#1b3326; --bad:#ff8a80; --bad-soft:#3a2120; --warn:#e7b85a; --warn-soft:#3a2f17;
  --old:#c4705a; --new:#3b4a50; --small:#a98bd0; --road:#20292e; --roadline:#34424a; --nobuild:#1f272c;
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --paper:#141a1e; --sheet:#1b2328; --ink:#e4e9ea; --ink-2:#9fadb3; --line:#2f3b42; --grid:#222c32;
  --redline:#ff6a5f; --accent:#7db8e0; --accent-soft:#1f3242;
  --ok:#6fcf93; --ok-soft:#1b3326; --bad:#ff8a80; --bad-soft:#3a2120; --warn:#e7b85a; --warn-soft:#3a2f17;
  --old:#c4705a; --new:#3b4a50; --small:#a98bd0; --road:#20292e; --roadline:#34424a; --nobuild:#1f272c;
  color-scheme:dark; }
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55}
*{box-sizing:border-box}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:16px 40px}
header.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:6px 14px;border-bottom:1px solid var(--line)}
.mark{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.01em}
.mark svg{flex:none}
.mark small{font-family:var(--f-mono);font-weight:500;color:var(--ink-2)}
header.top h1{font-size:18px;margin:0;font-weight:600;text-wrap:balance}
.demo{margin-left:auto;font-size:12px;background:var(--warn-soft);color:var(--warn);padding:4px 10px;border-radius:4px}
nav.steps{display:flex;gap:4px;overflow-x:auto;padding-block:12px;scrollbar-width:thin}
nav.steps button{flex:none;font:inherit;border:1px solid var(--line);background:var(--sheet);color:var(--ink-2);padding:7px 12px;border-radius:6px;cursor:pointer;display:flex;gap:6px;align-items:center}
nav.steps button .n{font-family:var(--f-mono);font-size:11px;color:var(--ink-2)}
nav.steps button[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
nav.steps button[aria-selected="true"] .n{color:var(--paper)}
nav.steps button:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
nav.steps .arrow{color:var(--line);align-self:center;flex:none}
.layout{display:grid;grid-template-columns:minmax(0,var(--lw,53%)) 12px minmax(0,1fr);gap:4px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:1fr}.hsplit{display:none}}
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:14px;min-width:0}
.panel h2{font-size:15px;margin:0 0 10px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.panel h3{font-size:13px;margin:16px 0 6px;color:var(--ink-2);font-weight:600;letter-spacing:.02em}
.mapbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.chip{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);padding:5px 10px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--redline);color:var(--redline);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{font:inherit;font-size:12px;border:0;background:var(--sheet);color:var(--ink-2);padding:5px 9px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.btn{font:inherit;font-size:13px;border:1px solid var(--accent);background:var(--accent);color:var(--sheet);padding:5px 11px;border-radius:6px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.svgbox{border:1px solid var(--line);border-radius:6px;background:var(--sheet);overflow:hidden}
svg#map{display:block;width:100%;height:auto;touch-action:manipulation}
svg#map.drawing{cursor:crosshair}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-2px;margin-right:4px;border:1px solid var(--roadline)}
.hint{font-size:12px;color:var(--ink-2);margin-top:6px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.kpi{border:1px solid var(--line);border-radius:6px;padding:9px 10px;min-width:0}
.kpi .l{font-size:12px;color:var(--ink-2)}
.kpi .v{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;font-family:var(--f-mono);letter-spacing:-.01em}
.kpi .f{font-size:12px;color:var(--ink-2);font-family:var(--f-body);font-variant-numeric:tabular-nums;line-height:1.45;overflow-wrap:anywhere}
.checks{display:flex;flex-direction:column;gap:6px}
.chk{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.chk.req{border-left:3px solid var(--ink-2)}
.pill{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.chk .t{font-weight:500}
.chk .s{font-size:12px;color:var(--ink-2)}
.chk .num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13px;text-align:right;white-space:nowrap}
.verdict{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:6px;margin-bottom:10px;font-weight:600}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.bad{background:var(--bad-soft);color:var(--bad)}
.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:6px;max-height:380px;overflow-y:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:6px 8px;border-bottom:1px solid var(--grid);text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:var(--sheet);color:var(--ink-2);font-weight:600;font-size:12px;z-index:1}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--f-mono)}
tr.hl td{background:var(--accent-soft)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 14px}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field label{font-size:12px;color:var(--ink-2)}
.field input,.field select{font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--line);border-radius:5px;background:var(--paper);color:var(--ink);width:100%;font-variant-numeric:tabular-nums}
.field input[type=range]{padding:0;border:0;background:transparent;accent-color:var(--accent)}
.field .u{font-size:11px;color:var(--ink-2);font-family:var(--f-mono)}
.badge{font-size:11px;font-weight:600;padding:1px 6px;border-radius:4px}
.badge.v{background:var(--ok-soft);color:var(--ok)}
.badge.p{background:var(--warn-soft);color:var(--warn)}
.badge.a{background:var(--accent-soft);color:var(--accent)}
.note{font-size:12px;color:var(--ink-2);border-left:2px solid var(--line);padding-left:10px;margin-top:10px}
.big{font-family:var(--f-mono);font-size:30px;font-weight:600;font-variant-numeric:tabular-nums}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.ledger td:first-child{color:var(--ink-2)}
.ledger tr.sum td{font-weight:600;border-top:1px solid var(--ink-2)}
.bar{height:8px;border-radius:4px;background:var(--grid);overflow:hidden;margin-top:4px}
.bar span{display:block;height:100%;background:var(--accent)}
.rules dt{font-weight:600;margin-top:10px}
.rules dd{margin:2px 0 0;color:var(--ink-2);font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:6px;font-size:13px;z-index:5000;box-shadow:0 2px 8px rgba(0,0,0,.25);max-width:calc(100vw - 32px)}
@media (prefers-reduced-motion: no-preference){ .kpi .v,.big{transition:color .2s} }

.verdict.warn{background:var(--warn-soft);color:var(--warn)}
.demo.real{background:var(--ok-soft);color:var(--ok)}
.btn.sm{font-size:12px;padding:3px 9px;text-decoration:none;display:inline-flex;align-items:center}
.source{font-size:13px;color:var(--ink-2);display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-top:10px}
.source b{color:var(--ink)}
.acc{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);padding:1px 7px;border-radius:999px;cursor:pointer;white-space:nowrap}
.acc.ok{border-color:var(--ok);color:var(--ok)}
.acc.bad{border-color:var(--bad);color:var(--bad)}
.acc.man{font-weight:600}
.acc:hover{background:var(--grid)}
.lmap{height:var(--mh,560px);border:1px solid var(--line);border-radius:6px;background:var(--grid)}
@media (max-width:900px){.lmap{height:420px}}
.lmap .leaflet-tooltip{font-family:var(--f-body);font-size:12px;line-height:1.45;white-space:pre}
.search{display:flex;gap:6px;flex:1 1 240px;min-width:0}
.search input{flex:1;min-width:0;font:inherit;font-size:13px;padding:4px 8px;border:1px solid var(--line);border-radius:5px;background:var(--paper);color:var(--ink)}
.status{font-size:13px;padding:6px 10px;border-radius:6px;background:var(--accent-soft);color:var(--accent);margin-bottom:8px}
.status.err{background:var(--bad-soft);color:var(--bad)}
.chip.empty{color:var(--ink-2);border-style:dashed}
.empty-guide{color:var(--ink-2)}
.empty-guide ol{padding-left:18px;margin:8px 0}
[hidden]{display:none!important}
.lot-label{background:rgba(255,255,255,.75);border:0;box-shadow:none;font-size:11px;font-weight:600;color:#7a5c00;text-align:center;line-height:1.25;padding:1px 4px}
.lot-label::before{display:none}
.cut-tip{background:rgba(255,255,255,.85);border:0;box-shadow:none;font-weight:600}
.infra-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:4px 0 6px}
td.wrap{white-space:normal;min-width:220px;font-size:12px;color:var(--ink-2)}
tr.sum td{border-top:1px solid var(--ink-2)}
.lmap path.leaflet-interactive:focus,.lmap .leaflet-interactive:focus{outline:none}
.ghost-note{border:1px dashed var(--line);border-radius:6px;padding:8px 10px;margin-top:12px;font-size:13px}
.rel-chip{display:inline-block;margin:3px 8px 0 0;white-space:nowrap;font-size:12px}
td .u{font-size:11px;font-weight:400;color:var(--ink-2)}
.ghost-note .u{font-size:12px;color:var(--ink-2);margin-top:4px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.pick-pop{font-family:var(--f-body);font-size:13px;display:flex;flex-direction:column;gap:4px}
.pick-pop .u{color:#555;font-size:12px}
.pick-btns{display:flex;gap:6px;margin-top:4px}
.pick-pop .btn:disabled{opacity:.4;cursor:not-allowed}
.job{border:1px solid var(--accent);background:var(--accent-soft);color:var(--ink);border-radius:8px;padding:10px 12px;margin-bottom:12px}
.job-t{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--accent)}
.job-t b{color:var(--ink)}
.job .bar{height:6px;margin-top:8px;background:var(--sheet)}
.job .bar span{background:var(--accent);transition:width .3s}
.job-s{font-size:12.5px;color:var(--ink-2);margin-top:6px}
.spin{width:14px;height:14px;border:2px solid var(--accent);border-right-color:transparent;border-radius:50%;flex:none;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}
.zk{border:1px solid var(--line);border-radius:6px;margin-bottom:8px;background:var(--paper)}
.zk summary{cursor:pointer;padding:7px 10px;font-weight:600;font-size:13px}
.zk summary .u{font-weight:400;color:var(--ink-2);font-size:12px;margin-left:6px}
.zk-body{padding:0 10px 10px}
.zk textarea{width:100%;font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:5px;background:var(--sheet);color:var(--ink);resize:vertical}
.zk-opts{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;margin:6px 0}
.zk-btns{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.zk-anchor{display:inline-flex;gap:4px}
.zk-closure{border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-top:6px;font-size:13px;color:var(--ink)}
.zk-closure.ok{border-color:var(--ok)}
.zk-closure.ng{border-color:var(--bad)}
.zk-closure ul{margin:6px 0;padding-left:18px}
.zk-closure li{margin:2px 0}
.zk-closure li.good{color:var(--ok)}
.zk-closure li.warn{color:var(--bad)}
.zk-closure .u{font-size:12px;color:var(--ink-2)}
.zk-anchor input{width:120px;font:inherit;font-size:13px;padding:3px 6px;border:1px solid var(--line);border-radius:5px;background:var(--sheet);color:var(--ink)}
.zk-head{display:flex;gap:8px;align-items:center;margin:6px 0;font-size:13px}
.zk .warn,.status .warn{color:var(--bad)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
#pickBtn.on,#editBtn.on,#cutBtn.on{background:var(--redline);border-color:var(--redline);color:var(--sheet)}
#pickBtn.on{background:var(--redline);border-color:var(--redline)}
.lmap.picking{cursor:pointer}
.lmap.picking .leaflet-interactive{cursor:pointer}
.mapwrap{display:flex;gap:8px;align-items:stretch}
.mapwrap .lmap{flex:1;min-width:0}
.maptools{flex:none;width:34px;display:flex;flex-direction:column;gap:3px}
.maptools .mt{position:relative;width:34px;height:32px;display:flex;align-items:center;justify-content:center;font:15px/1 var(--f-body);padding:0;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);cursor:pointer}
.maptools .mt:hover{background:var(--grid)}
.maptools .mt.on{background:var(--accent);border-color:var(--accent);color:#fff}
.maptools .mt:disabled{opacity:.4;cursor:not-allowed}
.maptools .mt.danger{color:var(--bad)}
.maptools .mt-sep{height:1px;background:var(--line);margin:3px 4px}
.maptools .mt[data-tip]:hover::after,.maptools .mt[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;left:calc(100% + 8px);top:50%;transform:translateY(-50%);z-index:3000;width:max-content;max-width:260px;white-space:normal;text-align:left;font-size:12px;line-height:1.4;padding:5px 8px;border-radius:5px;background:var(--ink);color:var(--paper);box-shadow:0 2px 6px rgba(0,0,0,.2);pointer-events:none}
.mapwrap.full{position:fixed;inset:0;z-index:2000;background:var(--paper);padding:8px}
.mapwrap.full .lmap{height:auto;border-radius:0}
@media (max-width:700px){.mapwrap{flex-direction:column}.maptools{width:auto;flex-direction:row;flex-wrap:wrap}.maptools .mt-sep{width:1px;height:auto;margin:4px 2px}.maptools .mt[data-tip]:hover::after{left:0;top:calc(100% + 6px);transform:none}}
.hsplit{cursor:col-resize;align-self:stretch;position:relative;border-radius:4px;touch-action:none}
.hsplit::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;transform:translateX(-50%);background:var(--line);border-radius:2px}
.hsplit:hover::before,.hsplit:focus-visible::before,.hsplit.drag::before{background:var(--accent);width:4px}
.vsplit{cursor:row-resize;height:10px;margin:2px 0 4px;position:relative;touch-action:none}
.vsplit::before{content:"";position:absolute;left:42px;right:0;top:50%;height:2px;transform:translateY(-50%);background:var(--line);border-radius:2px}
.vsplit:hover::before,.vsplit:focus-visible::before,.vsplit.drag::before{background:var(--accent);height:4px}
.toolhelp{display:flex;flex-wrap:wrap;gap:2px 4px;align-items:center;font-size:12px;color:var(--ink-2);margin:0 0 6px;min-height:22px}
.toolhelp button{font:inherit;font-size:12px;border:0;background:none;color:var(--ink-2);padding:2px 5px;border-radius:4px;cursor:pointer}
.toolhelp button:hover,.toolhelp button.hot{background:var(--grid);color:var(--ink)}
.toolhelp button:disabled{opacity:.45;cursor:not-allowed}
.toolhelp .k{display:inline-block;width:16px;text-align:center;color:var(--ink)}
.toolhelp .tip{flex-basis:100%;height:19px;line-height:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink);font-weight:500;padding:0 5px}
.toolhelp .tip.idle{color:var(--ink-2);font-weight:400}
.toolhelp .sep{color:var(--line)}
body.resizing{user-select:none}
body.resizing .lmap{pointer-events:none}
.lmap-btn{display:block;width:30px;height:30px;line-height:30px;text-align:center;font-size:16px;background:#fff;color:#222;text-decoration:none}
td .u{font-size:11px;color:var(--ink-2);font-family:var(--f-mono)}
a.back{color:var(--accent);font-size:13px;text-decoration:none}
a.back:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="mark" aria-label="jbslab">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect x="1" y="1" width="24" height="24" rx="4" fill="var(--ink)"/><path d="M6 6h6v6H6zM14 6h6v6h-6zM6 14h6v6H6z" fill="var(--paper)" opacity=".85"/><path d="M14 14h6v6h-6z" fill="none" stroke="var(--redline)" stroke-width="1.6" stroke-dasharray="3 1.4 .8 1.4"/></svg>
      jbslab <small>/urban</small>
    </div>
    <h1>정비구역 지정 · 정비계획 검토</h1>
    <span class="demo" id="demoTag">불러오는 중</span>
    <a class="back" href="../">사업성 검토로</a>
  </header>
  <div class="source" id="source"></div>

  <nav class="steps" role="tablist" aria-label="검토 단계">
    <button role="tab" data-tab="zone" aria-selected="true"><span class="n">1</span>구역계·현황</button><span class="arrow">›</span>
    <button role="tab" data-tab="req" aria-selected="false"><span class="n">2</span>요건판정</button><span class="arrow">›</span>
    <button role="tab" data-tab="plan" aria-selected="false"><span class="n">3</span>정비계획</button><span class="arrow">›</span>
    <button role="tab" data-tab="arch" aria-selected="false"><span class="n">4</span>개략 건축계획</button><span class="arrow">›</span>
    <button role="tab" data-tab="biz" aria-selected="false"><span class="n">5</span>사업성</button><span class="arrow">·</span>
    <button role="tab" data-tab="rules" aria-selected="false"><span class="n">≡</span>적용 기준</button>
  </nav>

  <div class="layout">
    <section class="panel" aria-label="도면">
      <div class="mapbar">
        <span style="font-size:12px;color:var(--ink-2)">구역계</span>
        <span id="zoneChips" style="display:contents"></span>
        <span style="flex:1"></span>
        <button class="btn ghost" id="drawBtn">구역계 그리기</button>
        <button class="btn" id="finishBtn" hidden>완성</button>
        <button class="btn ghost" id="cancelBtn" hidden>취소</button>
      </div>
      <div class="mapbar" id="mapSearch">
        <form id="searchForm" class="search"><input id="searchQ" type="search" placeholder="주소·지번 검색 (예: 용현동 340)" aria-label="주소 검색"><button class="btn ghost sm" type="submit">이동</button></form>
      </div>
      <details class="zk" id="zkTools">
        <summary>지번 목록·필지 경계로 구역계 만들기 <span class="u">사업성 검토와 같은 도구</span></summary>
        <div class="zk-body">
          <div class="form">
            <div class="field"><label for="zkBase">기준 동 주소</label><input id="zkBase" placeholder="예: 인천광역시 미추홀구 용현동"><span class="u">지번만 쓴 줄 앞에 붙입니다. 주소 검색을 하면 자동으로 채웁니다</span></div>
            <div class="field"><label for="zkTh">필지 포함 기준(필지에 맞추기)</label><select id="zkTh"><option value="0.5">필지의 50% 이상이 범위 안</option><option value="0.3">30% 이상</option><option value="0.7">70% 이상</option><option value="0.9">90% 이상</option></select></div>
          </div>
          <div class="field" style="margin-top:8px"><label for="zkList">지번 목록 (한 줄에 하나)</label><textarea id="zkList" rows="5" placeholder="340&#10;340-1&#10;산12-3&#10;용현동 341"></textarea></div>
          <div class="zk-opts">
            <label><input type="checkbox" id="zkFill" checked> 구역 안에 갇힌 필지(도로 등) 자동 포함</label>
            <label><input type="checkbox" id="zkBridge" checked> 떨어진 블록 사이 도로로 잇기</label>
            <label class="zk-edge">구역 경계 도로 <select id="zkEdge"><option value="none">불포함(기본)</option><option value="half">일부 포함 – 중심선까지</option><option value="all">포함 – 도로 폭 전체</option></select></label>
          </div>
          <div class="zk-btns">
            <button class="btn sm" type="button" id="zkJibunBtn">지번으로 구역 만들기</button>
            <button class="btn sm" type="button" id="zkCloseBtn" title="제출된 토지조서의 지번만 그대로 합쳐, 한 덩어리로 닫히는지(폐합)·안에 빠진 필지·틈을 확인합니다">제출 조서 폐합 검토</button>
            <button class="btn ghost sm" type="button" id="zkFileBtn">엑셀·CSV에서 지번 읽기</button>
            <button class="btn sm" type="button" id="zkSnapBtn" title="손으로 대략 그린 구역계를 실제 필지 경계에 맞춥니다">그린 구역을 필지에 맞추기</button>
            <span class="zk-anchor"><input id="zkTarget" inputmode="decimal" placeholder="목표 면적 ㎡" aria-label="목표 면적"><button class="btn ghost sm" type="button" id="zkAnchorBtn" title="고시문의 위치 지번들과 면적으로 대략 범위를 추정한 뒤 필지에 맞춥니다">위치 지번 + 면적으로 추정</button></span>
            <input id="zkFile" type="file" accept=".xlsx,.xls,.csv,.txt" hidden>
          </div>
          <p class="hint" id="zkMsg"></p>
          <div id="zkReport"></div>
        </div>
      </details>
      <div class="mapbar">
        <span style="font-size:12px;color:var(--ink-2)">색 구분</span>
        <div class="seg" role="group" aria-label="도면 색 구분">
          <button data-mode="old" aria-pressed="true">노후·불량</button>
          <button data-mode="small" aria-pressed="false">과소필지</button>
          <button data-mode="access" aria-pressed="false">접도</button>
          <button data-mode="zone" aria-pressed="false">용도지역</button>
          <button data-mode="infra" aria-pressed="false">기반시설</button>
          <button data-mode="arch" aria-pressed="false">개략 배치</button>
        </div>
      </div>
      <div class="status" id="status" hidden></div>
      <div class="toolhelp" id="toolHelp" aria-live="polite"></div>
      <div class="mapwrap" id="mapWrap">
        <div class="maptools" id="mapTools" role="toolbar" aria-label="구역계 도구" aria-orientation="vertical">
          <button class="mt" id="pickBtn" type="button" data-tip="필지 넣고 빼기 — 지도에서 필지를 누르면 넣을지 뺄지 고릅니다" aria-label="필지 넣고 빼기">±</button>
          <button class="mt" id="editBtn" type="button" data-tip="꼭짓점 끌기 — 구역계 꼭짓점을 끌어서 고칩니다" aria-label="꼭짓점 끌기">◇</button>
          <button class="mt" id="cutBtn" type="button" data-tip="구역계 자르기 — 선을 그어 자르고 조각을 빼거나 도로로 지정. 필지 끝점·중간점·수직점·근처점에 붙음" aria-label="구역계 자르기">✂</button>
          <span class="mt-sep" aria-hidden="true"></span>
          <button class="mt" id="undoBtn" type="button" disabled data-tip="실행 취소 (Ctrl+Z)" aria-label="실행 취소">↶</button>
          <button class="mt" id="redoBtn" type="button" disabled data-tip="다시 실행 (Ctrl+Y)" aria-label="다시 실행">↷</button>
          <span class="mt-sep" aria-hidden="true"></span>
          <button class="mt" id="fetchBtn" type="button" data-tip="필지·건축물·토지특성·건축물대장 다시 불러오기" aria-label="다시 불러오기">⟳</button>
          <button class="mt" id="geoInBtn" type="button" data-tip="GeoJSON 파일로 구역계 열기" aria-label="GeoJSON 열기">⇩</button>
          <button class="mt" id="geoOutBtn" type="button" data-tip="구역계를 GeoJSON 파일로 저장" aria-label="GeoJSON 저장">⇧</button>
          <button class="mt danger" id="clearBtn" type="button" data-tip="이 안의 구역계 지우기" aria-label="이 안 지우기">✕</button>
          <input id="geoFile" type="file" accept=".geojson,.json,application/geo+json,application/json" hidden>
        </div>
        <div id="lmap" class="lmap"></div>
      </div>
      <div class="vsplit" id="vSplit" role="separator" aria-orientation="horizontal" aria-label="지도 높이 조절 (끌거나 위·아래 화살표)" tabindex="0"></div>
      <div class="svgbox" id="svgbox" hidden><svg id="map" viewBox="-6 -6 416 328" role="img" aria-label="예시 구역 지적도"></svg></div>
      <div class="legend" id="legend"></div>
      <p class="hint" id="drawHint"></p>
    </section>

    <div class="hsplit" id="hSplit" role="separator" aria-orientation="vertical" aria-label="지도·설명 화면 너비 조절 (끌거나 좌·우 화살표, 두 번 누르면 처음대로)" tabindex="0"></div>
    <section class="panel" id="side" aria-live="polite"></section>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Turf.js/6.5.0/turf.min.js"></script>
